services:
  fleetlog-service:
    image: ${FLEETLOG_IMAGE:-ghcr.io/gustabessa/fleetlog:main}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      fleetlog-db:
        condition: service_healthy
  fleetlog-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleetlog
      POSTGRES_USER: fleetlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetlog -d fleetlog"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
