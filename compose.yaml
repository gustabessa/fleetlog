services:
  fleetlog-service:
    image: ${FLEETLOG_IMAGE:-ghcr.io/gustabessa/fleetlog:main}
    pull_policy: always
    environment:
      PGHOST: fleetlog-db
      PGPORT: "5432"
      PGDATABASE: fleetlog
      PGUSER: fleetlog
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      PGSSLMODE: disable
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_PATH_STYLE: "${S3_PATH_STYLE:-false}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_DISCOVERY_URL: "${OIDC_DISCOVERY_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile}"
      OIDC_CALLBACK_PATH: "${OIDC_CALLBACK_PATH:-/api/auth/oidc/callback}"
      AUTH_LOCAL_ENABLED: "${AUTH_LOCAL_ENABLED:-true}"
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      fleetlog-db:
        condition: service_healthy
  fleetlog-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleetlog
      POSTGRES_USER: fleetlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetlog -d fleetlog"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
