# Dokploy production: Raw provider. Set an image built by Woodpecker.
services:
  fleetlog-service:
    image: ${FLEETLOG_IMAGE:?Set ghcr.io/gustabessa/fleetlog:sha-COMMIT}
    pull_policy: always
    environment:
      PGHOST: fleetlog-db
      PGPORT: "5432"
      PGDATABASE: fleetlog
      PGUSER: fleetlog
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      PGSSLMODE: disable
      PUBLIC_URL: ${PUBLIC_URL:?Set the public HTTPS URL}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      fleetlog-db:
        condition: service_healthy
    networks:
      - backend
      - dokploy-network
  fleetlog-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleetlog
      POSTGRES_USER: fleetlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetlog -d fleetlog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
volumes:
  postgres_data:
networks:
  backend:
  dokploy-network:
    external: true
