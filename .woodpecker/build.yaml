# Publish only trusted pushes to main; no secrets/build privileges for PRs.
when:
  - event: push
    branch: main

steps:
  - name: backend-checks
    image: golang:1.27.1-alpine
    environment:
      TEST_DATABASE_URL: postgres://fleetlog_test:ci-test-password@postgres:5432/fleetlog_test?sslmode=disable
    commands:
      - go test ./...
      - go vet ./...

  - name: publish-image
    image: docker.io/woodpeckerci/plugin-docker-buildx:6.1.2
    settings:
      registry: ghcr.io
      repo: ghcr.io/gustabessa/fleetlog
      dockerfile: Dockerfile
      context: .
      tags:
        - main
        - sha-${CI_COMMIT_SHA}
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token

services:
  - name: postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fleetlog_test
      POSTGRES_USER: fleetlog_test
      POSTGRES_PASSWORD: ci-test-password
